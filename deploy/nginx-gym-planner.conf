# Gym Planner: nginx serves the website files and passes /api to the API on this machine.
# Amazon Linux: save as /etc/nginx/conf.d/gym-planner.conf     Ubuntu: save as /etc/nginx/conf.d/gym-planner.conf too
# (setup-server.sh does this for you.)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/gym-planner;
    index index.html;

    # Pictures and videos are uploaded through the API: allow big files (the app allows videos up to 200 MB)
    client_max_body_size 210m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Safety headers for the website (the API adds its own)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # The API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;          # overwrite, never append: the client cannot fake its address
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;                                # large video uploads take a while
        proxy_request_buffering off;                            # stream uploads instead of filling the small disk first
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # Built files have hashed names: cache them hard. index.html must always be fresh.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Any other address is a page of the app (React handles it)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
